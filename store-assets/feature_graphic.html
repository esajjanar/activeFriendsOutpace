<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #0d0d0d;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 72px;
  }

  /* Subtle teal grid */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,191,165,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,191,165,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* Diagonal accent line */
  body::after {
    content: '';
    position: absolute;
    top: -60px;
    right: 280px;
    width: 2px;
    height: 650px;
    background: linear-gradient(to bottom, transparent, #00BFA5 40%, transparent);
    transform: rotate(-15deg);
    opacity: 0.4;
  }

  .left {
    position: relative;
    z-index: 1;
    flex: 1;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
  }

  .logo-row img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -3px;
    line-height: 1;
    white-space: nowrap;
  }

  .tagline-top {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #00BFA5;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.3px;
  }

  .right {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .pill {
    width: 210px;
    background: rgba(0,191,165,0.1);
    border: 1px solid rgba(0,191,165,0.25);
    border-radius: 100px;
    padding: 11px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    font-weight: 500;
  }

  .pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00BFA5;
    flex-shrink: 0;
  }

  .pill.dim {
    opacity: 0.45;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="tagline-top">Activity Tracking</div>
    <div class="logo-row">
      <img src="../app/assets/icon-lines-only.png" alt="Outpace">
      <h1>OUTPACE</h1>
    </div>
    <div class="tagline">Our club. Our activity. Our pace.</div>
  </div>
  <div class="right">
    <div class="pill"><span class="dot"></span> Leaderboard</div>
    <div class="pill"><span class="dot"></span> Activity Feed</div>
    <div class="pill"><span class="dot"></span> GPS Tracking</div>
    <div class="pill"><span class="dot"></span> Daily Nudges</div>
    <div class="pill"><span class="dot"></span> Manual Logging</div>
  </div>
</body>
</html>
