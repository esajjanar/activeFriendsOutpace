<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">

  <!-- Wifi-off symbol -->
  <g transform="translate(120, 28)">
    <path d="M-20,0 Q0,-16 20,0" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M-12,7 Q0,-5 12,7" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="14" r="2.5" fill="#009688" opacity="0.7"/>
    <line x1="-22" y1="16" x2="22" y2="-4" stroke="#ef5350" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Broken dumbbell -->
  <g transform="translate(120, 168)">
    <line x1="-52" y1="0" x2="-6" y2="0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="0" x2="52" y2="0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-5,-4 L0,0 L-4,4" fill="none" stroke="#ef5350" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M5,-4 L0,0 L4,4" fill="none" stroke="#ef5350" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="-60" y="-12" width="14" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <g transform="translate(56, 0) rotate(15)">
      <rect x="-7" y="-12" width="14" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
  </g>

  <!-- Stick figure -->
  <g transform="translate(120, 78)">
    <!-- Head = broken stopwatch -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-14" x2="0" y2="-20" stroke="#009688" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="-3.5" y="-23" width="7" height="5" rx="1.5" fill="#009688"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="currentColor"/>
    <!-- Crack -->
    <path d="M-5,-9 L0,-3 L-3,2 L2,8" fill="none" stroke="#ef5350" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Spark -->
    <path d="M9,-5 L6,-1 L9,-1 L6,4" fill="none" stroke="#ffc107" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body -->
    <line x1="0" y1="14" x2="0" y2="48" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arms -->
    <path d="M0,24 L-16,34 L-26,28" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,24 L12,18 L8,8" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Legs -->
    <path d="M0,48 L-18,62 L-30,60" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,48 L14,60 L8,68" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fading signal dots -->
  <circle cx="30" cy="60" r="2.5" fill="currentColor" opacity="0.35"/>
  <circle cx="22" cy="50" r="1.8" fill="currentColor" opacity="0.25"/>
  <circle cx="38" cy="48" r="1.2" fill="currentColor" opacity="0.15"/>
  <circle cx="210" cy="58" r="2.5" fill="currentColor" opacity="0.35"/>
  <circle cx="218" cy="48" r="1.8" fill="currentColor" opacity="0.25"/>
  <circle cx="202" cy="50" r="1.2" fill="currentColor" opacity="0.15"/>
</svg>
